{% extends "base_panel.html" %}
{% block titulo %}Materias{% endblock %}
{% block contenido %}
<p class="sub">Elige un grupo para ver a sus alumnos y sus calificaciones.</p>
<form method="get" action="{{ url_for('admin_alumnos') }}">
<div class="card"><label for="grupo">Grupo</label><select id="grupo" name="id_grupo"><option value="">Selecciona un grupo</option>
{% for m in materias %}{% set gs = grupos|selectattr("id_materia", "equalto", m.id_materia)|list %}{% if gs %}<optgroup label="{{ m.nombre }}">{% for g in gs %}<option value="{{ g.id_grupo }}">{{ g.etiqueta }} · {{ g.horario }} · {{ g.profesor }}</option>{% endfor %}</optgroup>{% endif %}{% endfor %}
</select></div>
<div class="bar"><a class="btn sec" href="{{ url_for('panel_admin') }}">Atrás</a><button class="btn" type="submit" data-necesita="#grupo">Siguiente</button></div>
</form>
{% endblock %}
